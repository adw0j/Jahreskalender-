<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: transparent;
        font-family: Arial, Helvetica, sans-serif;
    }

    .widget {
        width: 100%;
        max-width: 700px;
        background: #151515;
        border-radius: 8px;
        padding: 16px 18px;
        color: white;
    }

    .row {
        display: grid;
        grid-template-columns: 70px 1fr 75px;
        align-items: center;
        gap: 12px;
        margin: 10px 0;
    }

    .label {
        font-size: 14px;
        font-weight: 600;
    }

    .bar {
        height: 22px;
        border: 3px solid white;
        border-radius: 5px;
        overflow: hidden;
        background: #151515;
    }

    .fill {
        height: 100%;
        background: #eeeeee;
        transition: width 0.5s ease;
    }

    .value {
        font-size: 14px;
        white-space: nowrap;
    }

    @media (max-width: 500px) {
        .row {
            grid-template-columns: 55px 1fr 65px;
            gap: 8px;
        }

        .label,
        .value {
            font-size: 12px;
        }
    }
</style>
</head>

<body>

<div class="widget">

    <div class="row">
        <div class="label">YEAR</div>
        <div class="bar">
            <div class="fill" id="yearBar"></div>
        </div>
        <div class="value" id="yearValue"></div>
    </div>

    <div class="row">
        <div class="label">MONTH</div>
        <div class="bar">
            <div class="fill" id="monthBar"></div>
        </div>
        <div class="value" id="monthValue"></div>
    </div>

    <div class="row">
        <div class="label">WEEK</div>
        <div class="bar">
            <div class="fill" id="weekBar"></div>
        </div>
        <div class="value" id="weekValue"></div>
    </div>

    <div class="row">
        <div class="label">DAY</div>
        <div class="bar">
            <div class="fill" id="dayBar"></div>
        </div>
        <div class="value" id="dayValue"></div>
    </div>

</div>

<script>

function updateWidget() {

    const now = new Date();

    /* =========================
       YEAR
       ========================= */

    const year = now.getFullYear();

    const startYear = new Date(year, 0, 1);
    const startNextYear = new Date(year + 1, 0, 1);

    const millisecondsPerDay = 1000 * 60 * 60 * 24;

    const dayOfYear =
        Math.floor(
            (now - startYear) / millisecondsPerDay
        ) + 1;

    const daysInYear =
        Math.round(
            (startNextYear - startYear) /
            millisecondsPerDay
        );

    document.getElementById("yearBar").style.width =
        (dayOfYear / daysInYear * 100) + "%";

    document.getElementById("yearValue").textContent =
        dayOfYear + " / " + daysInYear;


    /* =========================
       MONTH
       ========================= */

    const month = now.getMonth() + 1;

    document.getElementById("monthBar").style.width =
        (month / 12 * 100) + "%";

    document.getElementById("monthValue").textContent =
        month + " / 12";


    /* =========================
       WEEK
       ========================= */

    const day = now.getDate();

    /*
       Woche innerhalb des Monats.

       1–7   = Woche 1
       8–14  = Woche 2
       15–21 = Woche 3
       22–31 = Woche 4

       Dadurch bleibt die Anzeige
       maximal bei 4 / 4.
    */

    const weekOfMonth =
        Math.min(
            4,
            Math.ceil(day / 7)
        );

    const totalWeeksInMonth = 4;

    document.getElementById("weekBar").style.width =
        (weekOfMonth / totalWeeksInMonth * 100) + "%";

    document.getElementById("weekValue").textContent =
        weekOfMonth + " / " + totalWeeksInMonth;


    /* =========================
       DAY
       ========================= */

    const daysInMonth =
        new Date(
            year,
            now.getMonth() + 1,
            0
        ).getDate();

    document.getElementById("dayBar").style.width =
        (day / daysInMonth * 100) + "%";

    document.getElementById("dayValue").textContent =
        day + " / " + daysInMonth;
}

updateWidget();

/* Aktualisierung jede Minute */
setInterval(updateWidget, 60000);

</script>

</body>
</html>
